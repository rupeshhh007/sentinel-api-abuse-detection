spring.application.name=sentinel
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Expose Prometheus and Health endpoints via Actuator
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# Sentinel Externalized Configuration
sentinel.rate-limit.window-seconds=60
sentinel.rate-limit.max-requests=30
sentinel.risk.threshold=60
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
server.forward-headers-strategy=none
server.error.include-message=never
sentinel.console.token=${SENTINEL_CONSOLE_TOKEN:}
