spring.application.name=springpractice
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Expose Prometheus and Health endpoints via Actuator
management.endpoints.web.exposure.include=health,prometheus
management.metrics.export.prometheus.enabled=true

# Sentinel Externalized Configuration
sentinel.rate-limit.window-seconds=60
sentinel.rate-limit.max-requests=30
sentinel.risk.threshold=60